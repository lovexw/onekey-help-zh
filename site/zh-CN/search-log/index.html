<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>搜索记录台账 | OneKey 帮助中心</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
body{margin:0;padding:24px 16px 64px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#1a1a1a;background:#fff;line-height:1.7}
main{max-width:52rem;margin:0 auto}
h1{font-size:1.3rem;margin:1rem 0 .4rem}
a{color:#0000EE}
table{border-collapse:collapse;width:100%;margin-top:1rem;font-size:.92rem}
th,td{border:1px solid #e6e6e6;padding:.45rem .6rem;text-align:left;vertical-align:top}
th{background:#f7f7f7;font-weight:600}
td.n{white-space:nowrap}
.meta{color:#595959;font-size:.9rem}
.btn{font:inherit;font-size:.9rem;padding:.35rem .8rem;border:1px solid #1a1a1a;background:#fff;border-radius:6px;cursor:pointer}
.btn:hover{background:#f2f2f2}
.empty{color:#595959;margin-top:1.2rem}
@media(max-width:480px){body{padding:16px 12px}}
</style>
</head>
<body>
<main>
<p><a href="/zh-CN/">← 返回帮助中心</a> · <a href="/zh-CN/search/">搜索页</a></p>
<h1>搜索记录台账</h1>
<p class="meta">记录本浏览器内每次搜索的关键词、时间、结果数与耗时（localStorage，上限 500 条）。部署到 Cloudflare 且绑定 KV 后，服务端日志另存于 /api/search-log。本页仅本机可见。</p>
<p>
<button class="btn" id="export">导出 CSV</button>
<button class="btn" id="clear">清空本机记录</button>
</p>
<div id="out"></div>
</main>
<script>
(function(){
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var all=[];
try{all=JSON.parse(localStorage.getItem('okhelp-searchlog')||'[]')}catch(e){}
var out=document.getElementById('out');
if(!all.length){out.innerHTML='<p class="empty">暂无记录。去 <a href="/zh-CN/search/">搜索页</a> 搜几次，再回到本页查看。</p>';return}
var rows=all.slice().reverse().map(function(e,i){
  return '<tr><td class="n">'+esc(e.t.replace('T',' ').slice(0,19))+'</td><td>'+esc(e.q)+'</td><td class="n">'+esc(e.n)+'</td><td class="n">'+esc(e.ms)+'ms</td></tr>';
}).join('');
out.innerHTML='<table><thead><tr><th>时间</th><th>关键词</th><th>结果数</th><th>耗时</th></tr></thead><tbody>'+rows+'</tbody></table>';
document.getElementById('export').onclick=function(){
  var csv='\uFEFF时间,关键词,结果数,耗时ms\n'+all.map(function(e){return [e.t,e.q,e.n,e.ms].map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='search-log.csv';a.click();
};
document.getElementById('clear').onclick=function(){if(confirm('确定清空本机搜索记录？')){localStorage.removeItem('okhelp-searchlog');location.reload()}};
})();
</script>
</body>
</html>
